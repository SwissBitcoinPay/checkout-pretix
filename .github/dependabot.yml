# Pull requests that keep the actions, the dependencies and uv up to date: one per ecosystem, all
# its updates grouped. Each waits a week after a release (cooldown), as the lockfile does
# (pyproject.toml, `exclude-newer`): time for a compromised release to be found and yanked before
# it reaches this repository.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dependencies:
        patterns: ["*"]
    ignore:
      # pyproject.toml's pretix-2026-7, -8 and -9 groups each pin one feature release of pretix,
      # at its latest bugfix release: Dependabot reads them as one dependency and would move every
      # group to the newest release (one PR proposed pretix 2026.9.1 for all three). They are
      # updated by hand, with pretix's releases (README, "Development").
      - dependency-name: pretix
    commit-message:
      prefix: build

  - package-ecosystem: pip
    # .github/ci-requirements.txt: uv, with its hashes, for the workflows.
    directory: /.github
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      uv:
        patterns: ["*"]
    commit-message:
      prefix: ci
