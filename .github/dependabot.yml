# Pull requests that keep the actions, the dependencies and uv up to date: one per ecosystem, all
# its updates grouped. Each waits a week after a release (cooldown), as the lockfile does
# (pyproject.toml, `exclude-newer`): time for a compromised release to be found and yanked before
# it reaches this repository.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dependencies:
        patterns: ["*"]
    commit-message:
      prefix: build

  - package-ecosystem: pip
    # .github/ci-requirements.txt: uv, with its hashes, for the workflows.
    directory: /.github
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      uv:
        patterns: ["*"]
    commit-message:
      prefix: ci
