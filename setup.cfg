[flake8]
# pretix's coding standard: flake8 and pep8-naming, as pretix's own code. Lines of 99 characters
# at most (black's 88 for the code). W503: black breaks lines before a binary operator.
ignore = W503
max-line-length = 99
# sdk/: the SDK's own files, pinned as they are (scripts/pin_sdk.py).
exclude = migrations,.ropeproject,static,_static,build,.venv,venv,sdk

[isort]
profile = black
combine_as_imports = true
known_third_party = pretix
known_first_party = pretix_sattleme,pretix_sattleme_e2e
extend_skip_glob = sdk/*

[tool:pytest]
DJANGO_SETTINGS_MODULE = pretix.testutils.settings
testpaths = tests
# The tests of scripts/translations.py import it.
pythonpath = scripts
addopts = --strict-markers -ra
markers =
    postgresql: tests of PostgreSQL's row locks, the database pretix runs on in production (deselected on SQLite: -m "not postgresql")

[coverage:run]
source = pretix_sattleme
omit = */migrations/*,*/tests/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __str__
    def __repr__
    if settings.DEBUG
    NOQA
    NotImplementedError

[check-manifest]
ignore =
    pretixplugin.toml
    Makefile
    scripts/check_dist.py
    scripts/pin_sdk.py
    scripts/postgres.py
    sdk/**
    e2e/**
    tests/test_sdk_pin.py
    tests/test_price_vectors.py
    uv.lock
    *.po
    .gitkeep
